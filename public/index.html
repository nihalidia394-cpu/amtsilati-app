<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Amtsilati</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Pendaftaran Amtsilati</h1>
        <p class="subtitle">Silakan isi formulir pendaftaran santri baru</p>

        <form id="formPendaftaran">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat">
            </div>

            <div class="form-group">
                <label for="umur">Umur</label>
                <input type="number" id="umur" placeholder="Contoh: 15">
            </div>

            <div class="form-group">
                <label for="jk">Jenis Kelamin</label>
                <select id="jk">
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nohp">No HP / WhatsApp</label>
                <input type="text" id="nohp" placeholder="081234567xxx">
            </div>

            <button type="submit" id="btnDaftar">Daftar Sekarang</button>
        </form>
    </div>
</div>

<script>
    // Gunakan listener agar HTML tetap bersih dari atribut onsubmit
    document.getElementById('formPendaftaran').addEventListener('submit', function(e) {
        e.preventDefault();

        // Ambil elemen
        const btn = document.getElementById('btnDaftar');
        const data = {
            nama: document.getElementById('nama').value,
            alamat: document.getElementById('alamat').value,
            umur: document.getElementById('umur').value,
            jk: document.getElementById('jk').value,
            nohp: document.getElementById('nohp').value
        };

        btn.innerText = "Mengirim...";
        btn.disabled = true;

        fetch("/daftar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.pesan); // Sesuaikan dengan key di server.js (pesan/message)
            if(data.status === 'sukses') {
                location.reload();
            }
        })
        .catch(err => {
            console.error("Error:", err);
            alert("Terjadi kesalahan koneksi ke server.");
        })
        .finally(() => {
            btn.innerText = "Daftar";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
